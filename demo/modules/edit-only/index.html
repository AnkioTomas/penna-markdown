<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仅编辑 · Penna Markdown</title>
  </head>
  <body>
    <div class="header">
      <a class="back" href="../../index.html">返回入口</a>
      <div class="title">仅编辑 · layout: "edit"</div>
      <div class="subtitle">预览区应被隐藏，不能留下空白栏</div>
      <div class="header-controls">
        <span id="layout-badge" class="timing" title="当前布局与预览可见性"
          >—</span
        >
        <label>
          主题
          <select id="theme-select" aria-label="选择渲染主题"></select>
        </label>
        <label>
          明暗
          <select id="appearance-select" aria-label="选择明暗模式">
            <option value="light">浅色</option>
            <option value="dark">深色</option>
            <option value="auto">跟随系统</option>
          </select>
        </label>
      </div>
    </div>
    <div class="app-container" id="penna-editor"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
